<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://static1.ballarddesigns.com/wcsstore/images/BallardDesigns/favicons/favicon-32x32.png"
    />
    <!-- Import CDN FontAwesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Css Style Link  -->
    <link rel="stylesheet" href="./style.css" />
    <title>Wall Arts | Ballard Desgins</title>
  </head>
  <body>

    <!-- Start Header Section -->
     <div class="container">
        <header class="header">
            <div class="firstHeader">
                <div class="nav-links">
                    <a href="#">Free Desgin Services</a>
                    <a href="">Refer a Friend, Get $50 Off!</a>
              </div>
            </div>
            <div class="secondHeader">
                <div class="logo">BALLARD DESIGNS</div>
                <div class="search-bar">
                  <input type="text" placeholder="What can we help you find?" />
                  <button><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <div class="icons">
                  <div class="icon">
                    <i class="fas fa-store"></i>
                    <span>Stores</span>
                  </div>
                  <div class="icon">
                    <i class="fas fa-truck"></i>
                    <span>Order Status</span>
                  </div>
                  <div class="icon">
                    <i class="fas fa-user"></i>
                    <span>Account</span>
                  </div>
                  <div class="icon cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                    <div class="cart-count">0</div>
                  </div>
                </div>
            </div>
        </header>
     </div>
    <!-- End Header Section -->

    <script src="./main.js"></script>
  </body>
</html>
